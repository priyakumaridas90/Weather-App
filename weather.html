<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="weather.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Special+Gothic&display=swap" rel="stylesheet">

</head>
<body>

<div class="container">

    <div class="weather-card">

        <h1>Weather App</h1>

        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city name">
            <button id="search-button">Search</button>
           
    </div>

    <div class="weather-info">
        <img id="weather-icon" alt="Weather Icon" src="weather.png">
        <h2 id="temperature">--°C</h2>
        <h3 id="city">City Name</h3>
        <p id="description">Weather Description</p>
        

    <div class="details">
        <div>
            <h4>Humidity</h4>
            <p id="humidity">--%</p>
        </div>
        <div>
            <h4>Wind Speed</h4>
            <p id="wind-speed">-- km/h</p>
        </div>
    </div>
    </div>

       

</div>
</div>
</div>


    <script src="weather.js"></script>
    
</body>
</html>
